<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <title>Fluenta — server unreachable</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
        background: #08080a;
        color: #f4f4f7;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 420px; width: 100%; }
      .mark { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(150deg, #e24a5e, #8c1626); font-weight: 800; font-size: 21px; margin-bottom: 22px; }
      h1 { font-size: 25px; letter-spacing: -0.02em; margin: 0 0 10px; }
      p { color: #a7a7b4; font-size: 14px; line-height: 1.6; margin: 0 0 18px; }
      code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; color: #e2a6ae; word-break: break-all; }
      .actions { display: grid; gap: 9px; margin-top: 22px; }
      button { font: inherit; font-size: 14.5px; font-weight: 600; padding: 14px 16px; border-radius: 12px; cursor: pointer; border: 1px solid #24242d; background: #101014; color: #f4f4f7; }
      button.primary { background: linear-gradient(180deg, #d03348, #a01b2d); border-color: transparent; }
      small { display: block; margin-top: 18px; color: #6a6a76; font-size: 11.5px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">F</div>
      <h1>Can’t reach your server</h1>
      <p>
        Fluenta could not load the server this app is connected to. The server may be offline, the
        address may have changed, or this device may be on a different network.
      </p>
      <p><code id="target">…</code></p>
      <div class="actions">
        <button class="primary" type="button" onclick="location.reload()">Try again</button>
        <button type="button" onclick="changeServer()">Use a different server</button>
      </div>
      <small>
        Your account lives on the server, not on this phone. Changing servers signs you out of this one.
      </small>
    </main>
    <script>
      (function () {
        var target = document.getElementById('target');
        try {
          target.textContent = new URL(location.href).searchParams.get('url') || location.href;
        } catch (_) {
          target.textContent = location.href;
        }
      })();

      function changeServer() {
        if (window.FluentaSetup) {
          window.FluentaSetup.reset();
          return;
        }
        alert('Open Android Settings → Apps → Fluenta → Storage and clear the app data, then reopen the app.');
      }
    </script>
  </body>
</html>

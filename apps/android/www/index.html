<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fluenta</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #08080a;
        color: #f4f4f7;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      p { color: #8b8b99; font-size: 13px; max-width: 30ch; line-height: 1.6; }
      .mark {
        width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 16px;
        background: linear-gradient(150deg, #e24a5e, #a01b2d);
        display: grid; place-items: center; font-weight: 800; font-size: 26px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">F</div>
      <p>
        This shell loads your Fluenta server. Set <code>FLUENTA_SERVER_URL</code> and rebuild to connect.
      </p>
    </div>
  </body>
</html>

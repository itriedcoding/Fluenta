name: Release

on:
  push:
    tags: ['v*']
    # Publishing from a release branch lets maintainers cut a release with a
    # plain branch push (no tag creation required). The branch name is the
    # version: release/v1.2.0 becomes tag v1.2.0 and release "v1.2.0".
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 1.0.1 (defaults to package.json)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/generate-icons.mjs
      - run: npm run build:web
      - name: Package web bundle
        run: |
          mkdir -p out/fluenta-web
          cp -r apps/server/public/* out/fluenta-web/
          cp README.md .env.example out/fluenta-web/ 2>/dev/null || true
          cd out && zip -qr fluenta-web.zip fluenta-web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/fluenta-web.zip

  desktop:
    name: Desktop (${{ matrix.os }})
    # Desktop installers are only built for tagged releases; branch-triggered
    # releases focus on the APK and web bundle.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: desktop-linux
            path: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.deb
          - os: windows-latest
            script: dist:win
            artifact: desktop-windows
            path: |
              apps/desktop/dist/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: desktop-macos
            path: apps/desktop/dist/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/generate-icons.mjs
      - name: Install shell dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build installers
        working-directory: apps/desktop
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "${VERSION:-}" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -z "${VERSION:-}" ] && [[ "${GITHUB_REF}" == refs/heads/release/v* ]]; then VERSION="${GITHUB_REF_NAME#release/v}"; fi
          VERSION="${VERSION#v}"
          if [ -z "${VERSION:-}" ]; then VERSION="$(node -p "require('./package.json').version")"; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "FLUENTA_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build:web
      - run: npm run android:version
      - name: Install Android shell
        working-directory: apps/android
        run: npm ci
      - name: Sync web assets and Capacitor config
        working-directory: apps/android
        run: npx cap sync android
      - name: Configure signing
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/apps/android/keystore/fluenta-release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KEYSTORE="$RUNNER_TEMP/release.jks"
            echo "::notice::Signing with the ANDROID_KEYSTORE_BASE64 secret."
          else
            echo "::warning::Using the public development signing key committed in apps/android/keystore. Add the ANDROID_KEYSTORE_BASE64 secret to sign releases with your own private key."
          fi
          {
            echo "FLUENTA_KEYSTORE=$KEYSTORE"
            echo "FLUENTA_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD:-fluentamobile}"
            echo "FLUENTA_KEY_ALIAS=${ANDROID_KEY_ALIAS:-fluenta}"
            echo "FLUENTA_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-fluentamobile}"
          } >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build signed release APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk out/fluenta-android.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs out/fluenta-android.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging out/fluenta-android.apk | head -5
          ls -lh out/fluenta-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/fluenta-android.apk

  release:
    name: Publish GitHub release
    # Runs for version tags and for release/v* branches. The APK and web bundle
    # are required; desktop assets are attached when their builds produced them.
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) &&
      needs.web.result == 'success' &&
      needs.android.result == 'success'
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${GITHUB_REF_NAME#release/v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: List release assets
        run: find artifacts -type f -printf '%p (%s bytes)\n'
      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/android/fluenta-android.apk
            artifacts/web/fluenta-web.zip
            artifacts/desktop-linux/*
            artifacts/desktop-windows/*
            artifacts/desktop-macos/*
